# XcodeGen project definition.
#
# The .xcodeproj is generated rather than committed: a pbxproj is unreadable in
# review and merges badly, and this file is the actual source of truth for what
# the two app targets contain.
#
#   brew install xcodegen
#   cd Apps && xcodegen generate
#
# See docs/SETUP.md. If you would rather build the project by hand in Xcode,
# that works too — this file then just documents what the targets need.

name: BioRhythm
options:
  bundleIdPrefix: com.biorhythm
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

# Both targets read SPOTIFY_CLIENT_ID and SPOTIFY_REDIRECT_URI from here.
# Config.local.xcconfig is gitignored; copy Config.example.xcconfig to create it.
configFiles:
  Debug: ../Config.local.xcconfig
  Release: ../Config.local.xcconfig

packages:
  BioRhythmCore:
    path: ..

targets:
  iOSCompanion:
    type: application
    platform: iOS
    sources:
      - path: iOSCompanion
      - path: Shared
    dependencies:
      - package: BioRhythmCore
        product: SpotifyKit
      - package: BioRhythmCore
        product: HRDJCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biorhythm.companion
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: iOSCompanion/Info.generated.plist
      properties:
        CFBundleDisplayName: bio-rhythm
        SPOTIFY_CLIENT_ID: $(SPOTIFY_CLIENT_ID)
        SPOTIFY_REDIRECT_URI: $(SPOTIFY_REDIRECT_URI)
        # The scheme here must match SPOTIFY_REDIRECT_URI and the redirect URI
        # registered in the Spotify dashboard, or the callback never arrives.
        CFBundleURLTypes:
          - CFBundleURLName: com.biorhythm.companion.callback
            CFBundleURLSchemes: [biorhythm]

  WatchApp:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
    dependencies:
      - package: BioRhythmCore
        product: SpotifyKit
      - package: BioRhythmCore
        product: HRDJCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biorhythm.companion.watchkitapp
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    # HealthKit arrives with M1's workout session. Read access only: §10 shares
    # HKWorkoutType only when R-14 is enabled, and asking for write access the
    # product does not use is a permission prompt that buys nothing.
    entitlements:
      path: WatchApp/WatchApp.generated.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: WatchApp/Info.generated.plist
      properties:
        CFBundleDisplayName: bio-rhythm
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.biorhythm.companion
        SPOTIFY_CLIENT_ID: $(SPOTIFY_CLIENT_ID)
        SPOTIFY_REDIRECT_URI: $(SPOTIFY_REDIRECT_URI)
        # Describes what the app does *now*. M1 reads HR and shows a zone;
        # nothing chooses a track until M3 enables actuation, and a permission
        # prompt that describes unbuilt behaviour is asking for consent to
        # something that is not happening. Revisit with M3.
        NSHealthShareUsageDescription: >-
          bio-rhythm reads your heart rate during a workout to show your effort
          zone and record it in the session log.

# Declared explicitly rather than relying on XcodeGen's default scheme
# generation, because CI builds by scheme name and CLAUDE.md documents
# `xcodebuild -scheme WatchApp`. A scheme that only exists by default is a
# scheme that can quietly stop existing.
schemes:
  WatchApp:
    build:
      targets:
        WatchApp: all
  iOSCompanion:
    build:
      targets:
        iOSCompanion: all
