name: CI

# The SwiftPM half of the build: HRDJCore and SpotifyKit, which is most of the
# code and all of the tests. These run with no simulator, no network, and no
# credentials — CLAUDE.md requires that and this job is what keeps it honest.
#
# The app targets (xcodegen + xcodebuild against a watchOS simulator) are a
# separate job, added once this one is green.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  # Deliberately no paths-ignore on pull_request. It was there, and it was
  # wrong in a way that took a near-miss to notice.
  #
  # `paths-ignore` skips the run rather than passing it, so a docs-only commit
  # pushed on top of a code commit leaves the PR head with *no checks at all* —
  # and `cancel-in-progress` below had already killed the code commit's run.
  # The result reads as "nothing failed" while nothing was built. An absent
  # check is much easier to mistake for a green one than a red check is.
  #
  # On a public repo the runner minutes are free, and the whole workflow is
  # under two minutes. Building a documentation change is cheap; believing an
  # unbuilt PR is green is not.
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the checkout. Set here rather than per
# job so a future job cannot quietly inherit a broader default token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One pin for both jobs. Pinned so an image bump cannot silently change the
  # Swift language mode underneath the project. The image currently carries
  # 26.0 through 26.6; 26.5 is what this project has been compiled against.
  # Bump deliberately, with a run to prove it, not by drifting.
  XCODE_APP: /Applications/Xcode_26.5.app

jobs:
  swiftpm:
    name: HRDJCore + SpotifyKit
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          # A bare `xcode-select -s` on a missing path fails with a terse
          # error that reads like a broken workflow rather than an image bump.
          # Say which pin is stale and what is actually available instead.
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Pinned toolchain $XCODE_APP is not on this runner image."
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
            echo "Update the XCODE_APP pin in .github/workflows/ci.yml to one of the above."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Building tests here rather than letting `swift test` do it means a
      # compile failure is reported as a build failure, with the whole error
      # list in one place.
      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  apps:
    name: WatchApp + iOSCompanion
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Pinned toolchain $XCODE_APP is not on this runner image."
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
            echo "Update the XCODE_APP pin in .github/workflows/ci.yml to one of the above."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"

      - name: Install XcodeGen
        run: brew install xcodegen

      # Config.local.xcconfig is gitignored and holds the owner's client ID.
      # Nothing reaches the network at build time, so the committed example —
      # placeholder ID and all — compiles identically to the real thing. Using
      # the example rather than a here-doc also means CI fails if the template
      # itself stops being a valid xcconfig.
      - name: Synthesise local configuration
        run: cp Config.example.xcconfig Config.local.xcconfig

      - name: Generate the Xcode project
        run: cd Apps && xcodegen generate

      # Simulator destinations, so no signing identity or provisioning profile
      # is needed. `generic/platform=` rather than a named device: the runner
      # image's simulator list is not something this workflow should depend on.
      - name: Build WatchApp
        run: |
          xcodebuild build \
            -project Apps/BioRhythm.xcodeproj \
            -scheme WatchApp \
            -destination 'generic/platform=watchOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOSCompanion
        run: |
          xcodebuild build \
            -project Apps/BioRhythm.xcodeproj \
            -scheme iOSCompanion \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
